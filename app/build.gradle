plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.protobuf'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.8.22'

}

import groovy.json.JsonOutput


def grpcVersion = "1.53.0"
def protobufVersion = "3.21.12"
def lifecycle_version = "2.6.1"

android {
    namespace 'me.sweettie.oma'
    compileSdk 36

    defaultConfig {
        applicationId "me.sweettie.oma"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            proto {
                srcDir '../oma-meta/proto'
            }
            java.srcDirs 'src/main/java'
        }
    }
}

dependencies {

    //noinspection GradleDependency
    implementation 'androidx.core:core-ktx:1.10.1'
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.12.0'
    //noinspection GradleDependency
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    //noinspection GradleDependency
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    //noinspection GradleDependency
    implementation "androidx.navigation:navigation-ui:2.7.7"
    implementation 'com.google.firebase:firebase-messaging-ktx:24.1.2'
    implementation 'androidx.activity:activity:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    //noinspection GradleDependency
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    //noinspection GradleDependency
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    //noinspection GradleDependency
    implementation "com.google.protobuf:protobuf-javalite:$protobufVersion"
    implementation "io.grpc:grpc-okhttp:$grpcVersion"
    implementation "io.grpc:grpc-protobuf-lite:$grpcVersion"
    implementation "io.grpc:grpc-stub:$grpcVersion"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"
    // thread-safe coroutine
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation 'io.github.chaosleung:pinview:1.4.4'

    implementation 'com.github.MicroRJ:android_superellipse:v3.0.0-alpha'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation("io.coil-kt.coil3:coil-compose:3.3.0")

}

configurations {
    configureEach {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:$protobufVersion"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:$grpcVersion"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option 'lite' }
            }
            task.plugins {
                grpc { option 'lite' }
            }
        }
    }
}

def versionStr = android.defaultConfig.versionName
def versionCode = android.defaultConfig.versionCode

tasks.register('uploadReleaseWithOutBuild', Exec) {
    def updText = JsonOutput.toJson([
            version_str: "New version available",
            version    : versionCode,
            title      : "v${versionStr}",
            change_log : []
    ])
    def apkPath2 = "D:\\projects\\AndroidStudioProjects\\Oma\\app\\release\\app-release.apk"

    def escapedJson = updText.replace('"', '\\"')

    commandLine 'cmd', '/c',
            "python C:\\server_upload.py \"${apkPath2}\" \"${escapedJson}\""
}

tasks.register('checkServerVersion', Exec) {
    commandLine 'curl', '-X', 'POST', 'https://sovamor.co/oma/android_version'

    standardOutput = new ByteArrayOutputStream()
    errorOutput = new ByteArrayOutputStream()
    ignoreExitValue true

    doLast {
        println "Stdout: ${standardOutput.toString()}"
        println "Stderr: ${errorOutput.toString()}"
    }
}

